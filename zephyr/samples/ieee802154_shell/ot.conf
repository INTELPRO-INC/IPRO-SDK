# Extra fragment for zephyr/samples/net/openthread/shell on ipro7_evb
CONFIG_ENTROPY_GENERATOR=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_IEEE802154_IPRO_RX_STACK_SIZE=2048

# Thread 1.4 (the lab border router is 1.4) and the OT CLI ping sender
CONFIG_OPENTHREAD_THREAD_VERSION_1_4=y
CONFIG_OPENTHREAD_PING_SENDER=y

# Radio timestamps and timed TX on the MAC symbol clock (CSL transmitter/receiver)
CONFIG_NET_PKT_TIMESTAMP=y
CONFIG_NET_PKT_TXTIME=y

# The radio driver secures frames (CCM*) and schedules CSL from the system workqueue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_OPENTHREAD_THREAD_STACK_SIZE=6144
# The radio driver secures frames (CCM*) on the OpenThread radio workqueue
CONFIG_OPENTHREAD_RADIO_WORKQUEUE_STACK_SIZE=2048

# Bench IPRO7 EVBs: RF crystal trim to within ~6 ppm of the nRF52840 / RT582
# references (ROM default 85 is ~+60 ppm; `ipro154 xtal` / `ipro154 cfo`).
# Not for the IPRO7AI Reef, which wants 95.
CONFIG_SOC_IPRO7_XTAL_CAPCODE=165
