# Sleepy end device with CSL (SSED): add on top of ot.conf
CONFIG_OPENTHREAD_CSL_RECEIVER=y
# CSL again after a reset (OpenThread keeps the period in RAM only)
CONFIG_IEEE802154_IPRO_OT_CSL_PERIOD_US=500000
CONFIG_IEEE802154_IPRO_OT_CSL_TIMEOUT_S=20
# HAL frame trace (ipro154 trace): protocol verification without a sniffer
CONFIG_IEEE802154_IPRO_FRAME_TRACE=y
CONFIG_IEEE802154_IPRO_FRAME_TRACE_AT_BOOT=y
