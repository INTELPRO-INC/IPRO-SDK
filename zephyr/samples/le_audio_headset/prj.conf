CONFIG_BT=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_UTF8=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="IPRO-LE-Audio"
CONFIG_BT_DEVICE_APPEARANCE=1089
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=50
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=70
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_PRIVACY=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# LE Audio: CAP acceptor, BAP unicast server (sink), VCP renderer
CONFIG_BT_AUDIO=y
CONFIG_BT_CAP_ACCEPTOR=y
CONFIG_BT_CAP_ACCEPTOR_SET_MEMBER=y
CONFIG_BT_CSIP_SET_MEMBER=y
CONFIG_BT_BAP_UNICAST_SERVER=y
CONFIG_BT_ATT_PREPARE_COUNT=1
CONFIG_BT_ASCS=y
CONFIG_BT_ASCS_MAX_ASE_SNK_COUNT=2
CONFIG_BT_ASCS_MAX_ASE_SRC_COUNT=0
CONFIG_BT_PAC_SNK=y
CONFIG_BT_PAC_SNK_LOC=y
CONFIG_BT_VCP_VOL_REND=y
CONFIG_BT_AUDIO_CODEC_CFG_MAX_METADATA_SIZE=24
CONFIG_BT_ISO_PERIPHERAL=y
CONFIG_BT_ISO_MAX_CHAN=2
CONFIG_BT_ISO_RX_BUF_COUNT=8
CONFIG_BT_ISO_RX_MTU=251
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247

# LC3 decode (liblc3, FPU)
CONFIG_LIBLC3=y
CONFIG_FPU=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8192

# IPRO7 controller: CIS peripheral needs the ISO archive and 32 KB EM
CONFIG_IPRO7_EM_SIZE_KB=32
CONFIG_BT_IPRO_CTLR_LIB="link1_periph"
CONFIG_BT_IPRO_CTLR_FEATURE="bt54_iso2"
CONFIG_BT_MAX_CONN=1
CONFIG_ENTROPY_GENERATOR=y

# Speaker
CONFIG_DMA=y
CONFIG_DAC=y
CONFIG_DAC_IPRO_STREAM=y
CONFIG_GPIO=y
