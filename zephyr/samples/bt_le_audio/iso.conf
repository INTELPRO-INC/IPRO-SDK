# IPRO7 controller with ISO (BLE 5.4 + LE Audio archive) for Zephyr's
# samples/bluetooth/iso_* and bap_* / cap_* / tmap_* samples:
#   -DEXTRA_CONF_FILE=<sdk>/zephyr/samples/bt_le_audio/iso.conf
#   -DEXTRA_DTC_OVERLAY_FILE=<sdk>/zephyr/samples/bt_peripheral_hr/ipro7.overlay
CONFIG_IPRO7_EM_SIZE_KB=32
CONFIG_BT_IPRO_CTLR_LIB="link1"
CONFIG_BT_IPRO_CTLR_FEATURE="bt54_iso2"
CONFIG_BT_MAX_CONN=1
CONFIG_ENTROPY_GENERATOR=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_LOG_MODE_MINIMAL=y
