# ---- Bluetooth LE peripheral --------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="IPRO7 OTA"
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_IPRO7_EM_SIZE_KB=16
CONFIG_BT_IPRO_CTLR_LIB="link1_periph"
CONFIG_BT_IPRO_CTLR_FEATURE="bt52"
CONFIG_BT_MAX_CONN=1
CONFIG_ENTROPY_GENERATOR=y

# ---- MCUmgr: SMP over BLE, image + OS groups ------------------------------
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="1.0.0"
CONFIG_REBOOT=y
CONFIG_HWINFO=y

# ---- housekeeping ------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
# SMP shares the console with the log output: a log line printed in the
# middle of an SMP response corrupts the frame, so keep the console quiet
# during an upload (image group at WRN, the heartbeat once a minute).
CONFIG_MCUMGR_GRP_IMG_LOG_LEVEL_WRN=y
CONFIG_MCUMGR_TRANSPORT_LOG_LEVEL_WRN=y
CONFIG_STREAM_FLASH_LOG_LEVEL_WRN=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=8192

# ---- SMP over the console shell too (mcumgr/smpmgr --port ...) ----------
CONFIG_BASE64=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y
# 2 Mbaud console: an SMP frame arrives faster than the shell thread drains
# the default 64-byte UART ring, so size the rings for whole frames.
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=2048
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=2048
CONFIG_MCUMGR_TRANSPORT_SHELL_MTU=512
CONFIG_MCUMGR_TRANSPORT_SHELL_RX_BUF_COUNT=8
CONFIG_SHELL_CMD_BUFF_SIZE=1024
