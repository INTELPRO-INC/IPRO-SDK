# MCUboot on IPRO7: boot2 loads MCUboot at the XIP base (boot_partition),
# MCUboot validates image-0 (slot0_partition) and jumps to it. Upgrades come
# from slot1 with swap-move (primary slot = secondary + 1 sector, which is
# how the boards lay the slots out; the upgrade image goes at the start of
# slot1); the SoC flash driver erases 4 KB sectors from RAM.
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=y
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
# No RTC/ADC/DAC in the bootloader
CONFIG_COUNTER=n
CONFIG_ADC=n
CONFIG_DAC=n
CONFIG_ENTROPY_GENERATOR=n

# Bootloader: no console shell (96 KB partition)
CONFIG_SHELL=n
