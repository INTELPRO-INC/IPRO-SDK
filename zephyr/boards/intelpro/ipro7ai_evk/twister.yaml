# Twister platform description (test metadata, not build configuration).

type: mcu
arch: riscv
vendor: intelpro
ram: 256
flash: 1024
toolchain:
  - cross-compile
supported:
  - counter
  - display
  - dma
  - entropy
  - flash
  - gpio
  - i2c
  - pwm
  - spi
  - uart
  - watchdog
  - ieee802154
  - ble
testing:
  ignore_tags:
    - net
