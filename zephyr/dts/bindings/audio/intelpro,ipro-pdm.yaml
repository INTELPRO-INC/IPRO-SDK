description: |
  IPRO7 PDM microphone input through the AUADC block. Pins are GPIO
  numbers muxed by the SDK HAL itself (function PDM; roles follow pad
  parity: even = PDM_CLK, odd = PDM_DIN): 0/1, 2/3, 8/7 on the EVB headers,
  18/19 on the IPRO7AI EVK (the two XTAL32K / AON "MSB" pads, which the HAL
  reclaims from the always-on block first).

compatible: "intelpro,ipro-pdm"

include: base.yaml

properties:
  clk-pin:
    type: int
    required: true
    enum: [0, 2, 8, 18]

  data-pin:
    type: int
    required: true
    enum: [1, 3, 7, 19]

  channel:
    type: string
    default: "left"
    enum: ["left", "right"]
    description: Which PDM channel (clock edge) the microphone drives.
