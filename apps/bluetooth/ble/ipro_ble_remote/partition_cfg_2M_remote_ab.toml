# IPRO BLE Remote on the IPRO7AI Reef - A/B OTA layout, 2 MB flash, with boot2.
#
# Layout:
#   0x000000  boot2      64K   IntelProCube chips/ipro7/builtin_imgs/boot2_v0.5.2/ipro_boot2_IPRO7_v0.5.2.bin
#   0x010000  PT0/PT1     4K + 4K
#   0x012000  FW  A[0]  824K   execute slot, boot2 unpacks OTA packages here
#   0x0E0000  FW  A[1]  512K   OTA staging: the phone writes the .xz.ota package here
#   0x160000  PSM       112K
#   0x17C000  backup/media, 0x1FF000 factory
#
# Why not the standard partition_cfg_2M.toml: an image written to its FW B
# slot (0x12A000) and made active never booted - no console output at all,
# with the entry's len set to the image size or to 0 - and the board had to be
# re-flashed in download mode (2026-10-06). B lies above the first 1 MB,
# believed to be the app's XIP window; that flow also has no boot2 to unpack
# a staged image.
#
# boot2 applies an OTA when the FW entry's activeIndex is 1: it checks the
# package's SHA256, unpacks the XZ payload into Address[0], resets activeIndex
# and boots (verified on the Reef 2026-10-06). A package that fails the check
# leaves boot2 in its USB rescue mode, not a dead board.
#
# No Boot2 (type 16) entry: with one, the flash tool emits a boot2 header the
# bootrom will not load.

[pt_table]
#partition table is 4K in size
address0 = 0x10000
address1 = 0x11000

[[pt_entry]]
type = 0
name = "FW"
device = 0
address0 = 0x12000
size0 = 0xCE000
address1 = 0xE0000
size1 = 0x80000
# A[0]=824K execute/decompress target; A[1]=512K XZ OTA staging.
# activeindex=0 -> boot A[0]. App sets it to 1 to stage an OTA in A[1].
len = 0
activeindex = 0
age = 0

[[pt_entry]]
type = 2
name = "PSM"
device = 0
address0 = 0x160000
size0 = 0x1C000
address1 = 0
size1 = 0
# 112KB persistent storage (OpenThread Active Dataset / allow-list / settings).
len = 0
activeindex = 0
age = 0

[[pt_entry]]
type = 3
name = "backup"
device = 0
address0 = 0x17C000
size0 = 0x1000
address1 = 0
size1 = 0
len = 0
activeindex = 0
age = 0

[[pt_entry]]
type = 4
name = "media"
device = 0
address0 = 0x17D000
size0 = 0x4000
address1 = 0
size1 = 0
len = 0
activeindex = 0
age = 0

[[pt_entry]]
type = 5
name = "factory"
device = 0
address0 = 0x1FF000
size0 = 0x1000
address1 = 0
size1 = 0
len = 0
activeindex = 0
age = 0
