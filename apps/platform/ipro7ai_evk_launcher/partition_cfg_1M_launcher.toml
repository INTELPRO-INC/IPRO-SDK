# 1 MiB flash layout for ipro7ai_evk_launcher - identical to the person-detect
# app's table (FW 320 KB at 0x3000, mfg 688 KB at 0x53000, factory at
# 0xFF000) so the two demos swap with a firmware + model flash and no
# re-partition. The gesture classifier (the RPS app's rps_v3.inm, ~300 KB) sits in mfg at +0x1000.
#
# Flash with ./flash.sh --full (first time), ./flash.sh (firmware only),
# ./flash.sh --model (model only). Always pass --pt: the tool's default table
# has no mfg entry.

[pt_table]
#partition table is 4K in size
address0 = 0x1000
address1 = 0x2000

[[pt_entry]]
type = 0
name = "FW"
device = 0
address0 = 0x3000
size0 = 0x50000
address1 = 0
size1 = 0
# compressed image must set len,normal image can left it to 0
len = 0
activeindex = 0
age = 0

[[pt_entry]]
type = 1
name = "mfg"
device = 0
address0 = 0x53000
size0 = 0xAC000
address1 = 0
size1 = 0
# compressed image must set len,normal image can left it to 0
len = 0
activeindex = 0
age = 0

[[pt_entry]]
type = 5
name = "factory"
device = 0
address0 = 0xFF000
size0 = 0x1000
address1 = 0
size1 = 0
# compressed image must set len,normal image can left it to 0
len = 0
activeindex = 0
age = 0
