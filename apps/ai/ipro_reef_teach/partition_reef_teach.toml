# IPRO7AI Reef Teach (apps/ai/ipro_reef_teach): partition_cfg_2M.toml with the
# firmware partition cut to 640 KB (the combined image is ~360 KB) and mfg
# grown to 1364 KB, room for all three Teach models at once (src/reef_mode.h).
# PSM, backup, media and factory are where the stock table has them. As in the
# stock table, FW's second copy (address1) points at mfg: no A/B update.
[pt_table]
#partition table is 4K in size
address0 = 0x1000
address1 = 0x2000

[[pt_entry]]
type = 0
name = "FW"
device = 0
address0 = 0x3000
size0 = 0xA0000
address1 = 0xA3000
size1 = 0x155000
# compressed image must set len,normal image can left it to 0
len = 0
activeindex = 0
age = 0

[[pt_entry]]
type = 1
name = "mfg"
device = 0
address0 = 0xA3000
size0 = 0x155000
address1 = 0
size1 = 0
# compressed image must set len,normal image can left it to 0
len = 0
activeindex = 0
age = 0

[[pt_entry]]
type = 2
name = "PSM"
device = 0
address0 = 0x1F8000
size0 = 0x2000
address1 = 0
size1 = 0
# compressed image must set len,normal image can left it to 0
len = 0
activeindex = 0
age = 0

[[pt_entry]]
type = 3
name = "backup"
device = 0
address0 = 0x1FA000
size0 = 0x1000
address1 = 0
size1 = 0
# compressed image must set len,normal image can left it to 0
len = 0
activeindex = 0
age = 0

[[pt_entry]]
type = 4
name = "media"
device = 0
address0 = 0x1FB000
size0 = 0x4000
address1 = 0
size1 = 0
# compressed image must set len,normal image can left it to 0
len = 0
activeindex = 0
age = 0

[[pt_entry]]
type = 5
name = "factory"
device = 0
address0 = 0x1FF000
size0 = 0x1000
address1 = 0
size1 = 0
# compressed image must set len,normal image can left it to 0
len = 0
activeindex = 0
age = 0

