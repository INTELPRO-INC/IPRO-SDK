description: IPRO7 PWM controller

compatible: "ipro,ipro7-pwm"

include: [pwm-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  "#pwm-cells":
    const: 3

pwm-cells:
  - channel
  - period
  - flags
